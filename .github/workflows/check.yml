name: V1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: shellcheck -S error -e SC1090,SC1091 install.sh bootstrap.sh commands/*.sh
      - run: git diff --check
  nix-evaluation:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nix-bin nix-setup-systemd
      - name: Evaluate pinned standalone Home Manager configuration
        env:
          NIX_CONFIG: experimental-features = nix-command flakes
        run: |
          export ANTIX_USER="$(id -un)" ANTIX_HOME="$HOME"
          nix eval --impure --no-update-lock-file --raw .#homeConfigurations.antix.activationPackage.drvPath
          nix flake check --no-build --no-update-lock-file
